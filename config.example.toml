[global]
backup_root = "/var/backups/svc-update"
# Required only when the TARGET service mounts writable host directories:
# allowed_bind_roots = ["/project/myapp"]

[email]
enabled = false
host = "smtp.internal.example"
port = 25
starttls = false
from = "svc-update@example.invalid"
to = ["ops@example.invalid"]

[services.nginx]
enabled = false
auto_update = false
policy = "patch"  # patch, minor, major, any, latest
image = "nginx"   # Public Docker Hub images only
compose_service = "web" # The services: KEY, not container_name
directory = "/srv/containers/nginx"
# Autodetect standard Compose file names, or select explicitly:
# compose_file = "docker-compose.yml"
# compose_files = ["compose.yaml", "compose.override.yaml"]
version_variable = "NGINX_VERSION"
archive_image = "busybox:1.36.1"
health_url = "http://127.0.0.1:18080/"
health_timeout_seconds = 90
# To allow automated major/latest updates (high risk):
# allow_breaking_auto_update = true
